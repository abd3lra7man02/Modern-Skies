<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hull Shading Gradients -->
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E2631"/>
      <stop offset="25%" stop-color="#2D3748"/>
      <stop offset="50%" stop-color="#4A5568"/>
      <stop offset="75%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1E2631"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#0284C7" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="engineNozzleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Drop Shadow for Depth -->
  <g opacity="0.4" transform="translate(0, 14)">
    <path d="M256,38 L284,155 L456,325 L406,375 L334,342 L312,460 L274,460 L268,432 L244,432 L238,460 L200,460 L178,342 L106,375 L56,325 L228,155 Z" fill="#000000"/>
  </g>

  <!-- Outer Wings & Main Airframe Base (Diamond Stealth Planform) -->
  <path d="M256,40 L284,155 L452,322 L402,370 L334,340 L310,455 L274,455 L268,428 L244,428 L238,455 L202,455 L178,340 L110,370 L60,322 L228,155 Z"
        fill="url(#hullGrad)" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Stealth Radar-Absorbent Leading Edge Facets (Chines & Wings) -->
  <path d="M256,40 L284,155 L452,322 L438,332 L280,172 L256,70 L232,172 L74,332 L60,322 L228,155 Z"
        fill="url(#edgeGrad)" opacity="0.85"/>

  <!-- Wing Trailing Edge & Flaperons / Elevons -->
  <!-- Left wing control surfaces -->
  <polygon points="84,338 168,344 162,356 100,364" fill="#1E2631" stroke="#334155" stroke-width="1.5"/>
  <polygon points="174,342 216,358 212,372 170,354" fill="#1E2631" stroke="#334155" stroke-width="1.5"/>
  <!-- Right wing control surfaces -->
  <polygon points="428,338 344,344 350,356 412,364" fill="#1E2631" stroke="#334155" stroke-width="1.5"/>
  <polygon points="338,342 296,358 300,372 342,354" fill="#1E2631" stroke="#334155" stroke-width="1.5"/>

  <!-- Canted Vertical Stabilizers / Twin Tails -->
  <!-- Left Tail Fin -->
  <polygon points="206,310 226,306 200,448 184,444" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <polygon points="184,444 200,448 196,456 182,450" fill="#1E293B"/>
  <!-- Right Tail Fin -->
  <polygon points="306,310 286,306 312,448 328,444" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <polygon points="328,444 312,448 316,456 330,450" fill="#1E293B"/>

  <!-- Twin Turbofan Engine Nacelles & Air Inlets -->
  <!-- Left Intake -->
  <polygon points="218,188 238,188 234,295 214,288" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <!-- Right Intake -->
  <polygon points="294,188 274,188 278,295 298,288" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Engine Exhaust Nozzles (Titanium Ceramic vectoring pedals) -->
  <!-- Left Nozzle -->
  <path d="M204,442 L236,442 L234,464 L206,464 Z" fill="url(#engineNozzleGrad)" stroke="#475569" stroke-width="1.5"/>
  <line x1="214" y1="442" x2="214" y2="464" stroke="#64748B" stroke-width="1"/>
  <line x1="226" y1="442" x2="226" y2="464" stroke="#64748B" stroke-width="1"/>
  <ellipse cx="220" cy="462" rx="11" ry="3" fill="#00E5FF" filter="url(#glow)" opacity="0.9"/>

  <!-- Right Nozzle -->
  <path d="M276,442 L308,442 L306,464 L278,464 Z" fill="url(#engineNozzleGrad)" stroke="#475569" stroke-width="1.5"/>
  <line x1="286" y1="442" x2="286" y2="464" stroke="#64748B" stroke-width="1"/>
  <line x1="298" y1="442" x2="298" y2="464" stroke="#64748B" stroke-width="1"/>
  <ellipse cx="292" cy="462" rx="11" ry="3" fill="#00E5FF" filter="url(#glow)" opacity="0.9"/>

  <!-- Fuselage Dorsal Spine & Panel Lines -->
  <path d="M256,42 L270,140 L274,310 L256,415 L238,310 L242,140 Z"
        fill="#374151" stroke="#4B5563" stroke-width="1.2"/>
  <line x1="256" y1="44" x2="256" y2="412" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="12,4"/>

  <!-- Stealth Hardpoint Missile Pylons (Underwing) -->
  <!-- Left Pylon & Rail -->
  <rect x="136" y="285" width="6" height="36" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <rect x="137" y="278" width="4" height="10" rx="1" fill="#EF4444"/>
  <!-- Right Pylon & Rail -->
  <rect x="370" y="285" width="6" height="36" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <rect x="371" y="278" width="4" height="10" rx="1" fill="#EF4444"/>

  <!-- Gun Port (Right Shoulder 20mm M61A2 Vulcan Vent) -->
  <ellipse cx="278" cy="145" rx="3" ry="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>

  <!-- Pilot Cockpit Canopy (Photorealistic Stealth Bubble with Reflections) -->
  <ellipse cx="256" cy="168" rx="18" ry="48" fill="url(#canopyGrad)" stroke="#0284C7" stroke-width="2"/>
  <!-- Canopy Glass Glare Streak -->
  <path d="M250,132 Q254,165 248,198" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <path d="M254,126 Q260,155 255,180" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Pilot HUD Green Glow in Cockpit -->
  <rect x="252" y="140" width="8" height="6" rx="1" fill="#22C55E" opacity="0.8" filter="url(#glow)"/>

  <!-- Military Formations & Navigation Lights -->
  <!-- Port (Left) Red Nav Light -->
  <circle cx="59" cy="324" r="4" fill="#EF4444" filter="url(#glow)"/>
  <!-- Starboard (Right) Green Nav Light -->
  <circle cx="453" cy="324" r="4" fill="#22C55E" filter="url(#glow)"/>
  <!-- Formation Luminescent Slime Lights (Slim modern green strips) -->
  <rect x="254" y="58" width="4" height="16" fill="#84CC16" opacity="0.85"/>
  <rect x="180" y="432" width="3" height="12" fill="#84CC16" opacity="0.85"/>
  <rect x="329" y="432" width="3" height="12" fill="#84CC16" opacity="0.85"/>
</svg>